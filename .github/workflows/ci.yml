name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Secret scan (must pass)
        run: python tools/check_secrets.py

      - name: Run offline tests
        run: |
          python -V
          fail=0
          for f in tests/test_*.py; do
            echo "=== $f ==="
            if out=$(python "$f" 2>&1); then
              echo "PASS  $f"
            else
              echo "$out" | tail -30
              msg=$(echo "$out" | tail -c 800 | tr '\n' ' ' | tr -d '\r')
              echo "::error title=FAILED ${f}::${msg}"
              fail=1
            fi
          done
          exit $fail

      - name: Build package
        run: python tools/package.py

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-py${{ matrix.python-version }}
          path: dist/*.zip
          if-no-files-found: warn
