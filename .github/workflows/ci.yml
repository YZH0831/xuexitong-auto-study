name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Secret scan (must pass)
        run: python tools/check_secrets.py

      - name: Run offline tests
        run: |
          python -V
          fail=0
          for f in tests/test_*.py; do
            echo "=== $f ==="
            if out=$(python "$f" 2>&1); then
              echo "PASS  $f"
            else
              echo "$out" | tail -30
              msg=$(echo "$out" | tail -c 800 | tr '\n' ' ' | tr -d '\r')
              echo "::error title=FAILED ${f}::${msg}"
              fail=1
            fi
          done
          exit $fail

      - name: Build package
        run: python tools/package.py

      # 分发包必须"解压即用"：曾因打包排除规则漏掉 __init__.py 而无人发现
      - name: Verify package is runnable
        run: |
          set -e
          rm -rf /tmp/pkg && mkdir -p /tmp/pkg
          unzip -q dist/*.zip -d /tmp/pkg
          cd /tmp/pkg/chaoxing-auto-study-*/
          echo "--- import 检查 ---"
          python -c "import cxlab, sys; print('cxlab', cxlab.__version__); assert cxlab.__version__"
          echo "--- CLI 检查 ---"
          python main.py --version
          echo "--- 敏感文件不得入包 ---"
          for f in config.yaml state/storage_state.json data/question_pool.json; do
            if [ -e "$f" ]; then echo "::error title=包内含敏感文件::$f"; exit 1; fi
          done
          echo "✔ 分发包可用"

      # 不再上传构建产物：分发包只在 Release 里发布一份，
      # 避免 artifact 长期堆积（private 数据的旧包曾因此残留）
