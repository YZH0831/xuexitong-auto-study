<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学习通自动化助手 · 控制台</title>
<style>
:root{
  --bg:#070c18; --bg2:#0c1426; --panel:rgba(255,255,255,.035); --panel2:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.085); --line2:rgba(255,255,255,.16);
  --txt:#e9eefb; --muted:#8a9ab8; --dim:#5d6b88;
  --a:#6d8bff; --a2:#a06bff; --ok:#35d6a4; --warn:#ffc857; --err:#ff6b7d;
  --mono:"JetBrains Mono","Cascadia Code",Consolas,"Courier New",monospace;
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans); color:var(--txt); background:var(--bg);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(760px 480px at 12% -8%, rgba(109,139,255,.16), transparent 68%),
    radial-gradient(680px 460px at 96% 4%, rgba(160,107,255,.13), transparent 70%),
    radial-gradient(620px 520px at 60% 110%, rgba(53,214,164,.07), transparent 70%),
    linear-gradient(180deg,#070c18 0%,#0a1121 55%,#080e1c 100%);
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:44px 44px;mask-image:linear-gradient(180deg,rgba(0,0,0,.8),transparent 70%);
}
.wrap{position:relative;z-index:1;max-width:1440px;margin:0 auto;padding:26px 32px 46px}
svg.ic{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ── top bar ── */
.top{display:flex;align-items:center;gap:16px;padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:26px}
.logo{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;
  background:linear-gradient(145deg,var(--a),var(--a2));box-shadow:0 8px 28px rgba(109,139,255,.34),inset 0 1px 0 rgba(255,255,255,.3)}
.logo svg{width:24px;height:24px;stroke:#fff;stroke-width:1.9}
.brand h1{font-size:19px;font-weight:650;letter-spacing:.2px;line-height:1.25}
.brand .sub{font-size:12px;color:var(--muted);margin-top:3px;letter-spacing:.3px}
.ver{font:600 11px var(--mono);color:#b9c6ea;background:rgba(109,139,255,.13);border:1px solid rgba(109,139,255,.28);
  padding:3px 8px;border-radius:6px;margin-left:10px;vertical-align:2px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.pill{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:550;padding:8px 14px;border-radius:999px;
  border:1px solid var(--line2);background:var(--panel);color:var(--muted);white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.pill.on{color:#bff5e2;border-color:rgba(53,214,164,.32);background:rgba(53,214,164,.09)}
.pill.on .dot{background:var(--ok);box-shadow:0 0 0 4px rgba(53,214,164,.15);animation:pulse 2s infinite}
.pill.busy{color:#ffe3b0;border-color:rgba(255,200,87,.3);background:rgba(255,200,87,.08)}
.pill.busy .dot{background:var(--warn);box-shadow:0 0 0 4px rgba(255,200,87,.13);animation:pulse 2s infinite}
.pill.off{color:#ffc2cb;border-color:rgba(255,107,125,.3);background:rgba(255,107,125,.08)}
.pill.off .dot{background:var(--err)}
@keyframes pulse{50%{box-shadow:0 0 0 8px transparent}}
.addr{font:11px var(--mono);color:var(--dim)}

/* ── banner / hero ── */
.notice{display:none;align-items:center;gap:10px;padding:11px 15px;margin-bottom:18px;border-radius:11px;
  background:rgba(255,200,87,.08);border:1px solid rgba(255,200,87,.24);color:#ffe3b0;font-size:12.5px}
.notice.show{display:flex}
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;backdrop-filter:blur(14px);
  box-shadow:0 12px 40px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.035)}
.hero-main{padding:22px 24px;position:relative;overflow:hidden}
.hero-main::before{content:"";position:absolute;right:-70px;top:-90px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(109,139,255,.18),transparent 70%)}
.hero-label{font-size:11px;letter-spacing:1.6px;color:var(--muted);text-transform:uppercase;font-weight:600}
.hero-title{font-size:25px;font-weight:680;margin:12px 0 6px;letter-spacing:.2px}
.hero-desc{font-size:13px;color:var(--muted);line-height:1.65;min-height:21px}
.bar-wrap{margin-top:22px}
.bar-meta{display:flex;justify-content:space-between;font:11.5px var(--mono);color:var(--muted);margin-bottom:9px}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--a),var(--a2),#57e0c0);
  box-shadow:0 0 18px rgba(109,139,255,.6);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.hero-foot{display:flex;align-items:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 13px var(--sans);color:var(--txt);
  padding:10px 16px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;
  transition:.18s ease;white-space:nowrap}
.btn:hover:not(:disabled){transform:translateY(-1px);border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.1)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.primary{border:none;background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;
  box-shadow:0 8px 24px rgba(109,139,255,.3),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.primary:hover:not(:disabled){box-shadow:0 10px 30px rgba(109,139,255,.46)}
.btn.danger{color:#ffb9c3;border-color:rgba(255,107,125,.32);background:rgba(255,107,125,.09)}
.btn.danger:hover:not(:disabled){background:rgba(255,107,125,.16);border-color:rgba(255,107,125,.5)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--muted)}
.btn.sm{padding:7px 12px;font-size:12px;border-radius:8px}
.btn svg{width:16px;height:16px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:22px 24px}
.stat{background:rgba(255,255,255,.028);border:1px solid var(--line);border-radius:12px;padding:15px 16px}
.stat .k{font-size:11px;color:var(--muted);letter-spacing:.4px;margin-bottom:9px}
.stat .v{font:600 21px var(--mono);letter-spacing:-.5px}
.stat .v small{font-size:11px;color:var(--dim);font-weight:400;margin-left:4px}
.stat.ok .v{color:var(--ok)} .stat.blue .v{color:#9db4ff} .stat.warn .v{color:var(--warn)}

/* ── layout ── */
.cols{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);gap:18px;align-items:start}
.sec{margin-bottom:22px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.sec-h h2{font-size:13px;font-weight:650;letter-spacing:.6px;color:#cdd9f2}
.sec-h .line{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.sec-h .tag{font:11px var(--mono);color:var(--dim)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{position:relative;text-align:left;padding:16px 15px 15px;border-radius:14px;border:1px solid var(--line);
  background:var(--panel);cursor:pointer;color:var(--txt);font-family:inherit;transition:.2s ease;overflow:hidden;min-height:104px}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(109,139,255,.09),transparent 60%);opacity:0;transition:.2s}
.tile:hover:not(:disabled)::after{opacity:1}
.tile:hover:not(:disabled){transform:translateY(-3px);border-color:var(--line2);box-shadow:0 14px 30px rgba(0,0,0,.28)}
.tile:disabled{opacity:.42;cursor:not-allowed}
.tile .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;margin-bottom:12px;
  background:rgba(109,139,255,.12);color:#9db4ff;border:1px solid rgba(109,139,255,.16)}
.tile .ico svg{width:18px;height:18px}
.tile .t{font-size:13.5px;font-weight:620;letter-spacing:.2px}
.tile .d{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.5}
.tile.hero-tile{background:linear-gradient(120deg,rgba(109,139,255,.17),rgba(160,107,255,.11));
  border-color:rgba(109,139,255,.3)}
.tile.hero-tile .ico{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.22)}
.tile.hero-tile .t{font-size:15px}
.tile.c-ok .ico{background:rgba(53,214,164,.11);color:var(--ok);border-color:rgba(53,214,164,.18)}
.tile.c-warn .ico{background:rgba(255,200,87,.1);color:var(--warn);border-color:rgba(255,200,87,.18)}
.tile.c-purple .ico{background:rgba(160,107,255,.12);color:#c2a3ff;border-color:rgba(160,107,255,.18)}

/* ── terminal ── */
.term{padding:0;overflow:hidden;position:sticky;top:22px}
.term-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.02)}
.term-h .dots{display:flex;gap:5px;margin-right:4px}
.term-h .dots i{width:8px;height:8px;border-radius:50%;background:#ff6b7d;opacity:.75}
.term-h .dots i:nth-child(2){background:#ffc857} .term-h .dots i:nth-child(3){background:#35d6a4}
.term-h .name{font:11.5px var(--mono);color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font:600 10.5px var(--sans);padding:4px 9px;border-radius:6px;border:1px solid var(--line);
  background:transparent;color:var(--dim);cursor:pointer;transition:.15s}
.chip:hover{color:var(--txt);border-color:var(--line2)}
.chip.on{color:#cdd9f2;border-color:rgba(109,139,255,.4);background:rgba(109,139,255,.13)}
.term-body{height:452px;overflow-y:auto;padding:12px 6px 14px 14px;font:12px/1.72 var(--mono);scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,.16) transparent}
.term-body::-webkit-scrollbar{width:8px} .term-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:9px}
.ln{display:flex;gap:11px;padding:1px 8px 1px 0;border-radius:4px;white-space:pre-wrap;word-break:break-all}
.ln:hover{background:rgba(255,255,255,.035)}
.ln .n{color:#45546f;min-width:30px;text-align:right;user-select:none;flex:none}
.ln .c{color:#b9c7e4;flex:1}
.ln.info .c{color:#9fb4dc} .ln.warn .c{color:#ffd484} .ln.err .c{color:#ff98a6}
.ln.good .c{color:#7ee6bd} .ln.prog .c{color:#a8c4ff}
.ln.dim .c{color:#6d7d9b}
.term-foot{display:flex;align-items:center;gap:8px;padding:11px 15px;border-top:1px solid var(--line);background:rgba(255,255,255,.02)}
.term-foot .hint{font-size:11px;color:var(--dim);flex:1}
.input-row{display:none;gap:8px;padding:11px 14px;border-top:1px solid var(--line);background:rgba(109,139,255,.04)}
.input-row.show{display:flex}
.input-row input{flex:1;background:rgba(0,0,0,.25);border:1px solid var(--line2);border-radius:8px;
  padding:9px 12px;color:var(--txt);font:12.5px var(--mono);outline:none}
.input-row input:focus{border-color:var(--a)}

/* ── modal ── */
.mask{position:fixed;inset:0;background:rgba(3,7,16,.72);backdrop-filter:blur(6px);z-index:50;
  display:none;align-items:center;justify-content:center;padding:24px}
.mask.show{display:flex}
.modal{width:min(760px,100%);max-height:84vh;display:flex;flex-direction:column;
  background:#101a2e;border:1px solid var(--line2);border-radius:17px;box-shadow:0 30px 90px rgba(0,0,0,.6)}
.modal-h{display:flex;align-items:center;gap:10px;padding:17px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:15px;font-weight:650;flex:1}
.modal-b{padding:18px 20px;overflow:auto;font-size:13px;line-height:1.7;color:#c9d6ef}
.modal-b textarea{width:100%;height:52vh;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;
  padding:14px;color:#d8e4fa;font:12.5px/1.7 var(--mono);resize:vertical;outline:none}
.modal-b textarea:focus{border-color:var(--a)}
.modal-b pre{font:12px/1.7 var(--mono);white-space:pre-wrap;color:#b9c9e8}
.modal-f{display:flex;justify-content:flex-end;gap:9px;padding:14px 20px;border-top:1px solid var(--line)}
.rep-item{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;
  margin-bottom:9px;cursor:pointer;transition:.15s;background:rgba(255,255,255,.02)}
.rep-item:hover{border-color:var(--a);background:rgba(109,139,255,.09)}
.rep-item .nm{flex:1;font:12.5px var(--mono);color:#cfdcf7}
.rep-item .mt{font-size:11px;color:var(--dim)}

/* ── toast ── */
.toasts{position:fixed;right:24px;bottom:24px;z-index:80;display:flex;flex-direction:column;gap:9px;align-items:flex-end}
.toast{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:11px;font-size:12.5px;
  background:#152139;border:1px solid var(--line2);box-shadow:0 14px 40px rgba(0,0,0,.45);
  animation:slide .25s ease;max-width:390px}
.toast.ok{border-color:rgba(53,214,164,.4)} .toast.bad{border-color:rgba(255,107,125,.45)}
.toast svg{width:16px;height:16px}
@keyframes slide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.foot{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;
  font-size:11px;color:var(--dim);flex-wrap:wrap;gap:8px}
@media(max-width:1080px){
  .cols{grid-template-columns:1fr} .hero{grid-template-columns:1fr} .term{position:static}
  .tiles{grid-template-columns:repeat(2,1fr)} .term-body{height:340px}
}
@media(max-width:640px){
  .wrap{padding:18px 16px 32px} .tiles{grid-template-columns:1fr} .tile.hero-tile{grid-column:span 1}
  .brand h1{font-size:16px} .addr{display:none} .stat-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
<symbol id="i-logo" viewBox="0 0 24 24"><path d="M12 3 3 7.5l9 4.5 9-4.5L12 3Z"/><path d="M3 12l9 4.5 9-4.5M3 16.5 12 21l9-4.5"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="m7 4 12 8-12 8V4Z"/></symbol>
<symbol id="i-scan" viewBox="0 0 24 24"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3M3 12h18"/></symbol>
<symbol id="i-video" viewBox="0 0 24 24"><rect x="2.5" y="5" width="14" height="14" rx="2.5"/><path d="m16.5 10 5-3v10l-5-3"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6Z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></symbol>
<symbol id="i-quiz" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.1 1-1.1 1.8v.5M12 17h.01"/></symbol>

<symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5l-8-3Z"/><path d="m9 12 2 2 4-4"/></symbol>
<symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21H9.9v-.1A1.7 1.7 0 0 0 7 19.3l-.1.1-2.8-2.8.1-.1A1.7 1.7 0 0 0 4.6 15H4.5V9h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1 2.8-2.8.1.1A1.7 1.7 0 0 0 11.5 3v-.1h4V3a1.7 1.7 0 0 0 2.9 1.2l.1-.1 2.8 2.8-.1.1a1.7 1.7 0 0 0-1.2 2.9v.1h.1v6h-.1Z"/></symbol>
<symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 8.2-8.2 2 2-2 2 1.5 1.5-2.5 2.5-1.5-1.5-2.2 2.2"/></symbol>

<symbol id="i-report" viewBox="0 0 24 24"><path d="M4 19V5a2 2 0 0 1 2-2h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></symbol>

<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 6M20 5v6h-6"/></symbol>
</svg>

<div class="wrap">
  <header class="top">
    <div class="logo"><svg><use href="#i-logo"/></svg></div>
    <div class="brand">
      <h1>学习通自动化助手 <span class="ver" id="ver">v1.1.3</span></h1>
      <div class="sub">Chaoxing Auto Study · 本地控制台</div>
    </div>
    <div class="top-right">
      <span class="addr" id="addr">127.0.0.1</span>
      <div class="pill" id="statusPill"><span class="dot"></span><span id="statusText">连接中…</span></div>
    </div>
  </header>

  <div class="notice" id="notice"><svg class="ic"><use href="#i-alert"/></svg><span id="noticeText"></span></div>

  <section class="hero">
    <div class="card hero-main">
      <div class="hero-label">Current session</div>
      <div class="hero-title" id="heroTitle">等待开始</div>
      <div class="hero-desc" id="heroDesc">选择下方任务即可开始自动学习，运行期间请保持浏览器窗口可见。</div>
      <div class="bar-wrap">
        <div class="bar-meta"><span id="barLabel">当前进度</span><span id="barPct">0%</span></div>
        <div class="bar"><i id="barFill"></i></div>
      </div>
      <div class="hero-foot">
        <button class="btn primary" id="btnMain" onclick="run('run')"><svg class="ic"><use href="#i-play"/></svg>开始正式运行</button>
        <button class="btn danger" id="btnStop" onclick="stopJob()" disabled><svg class="ic"><use href="#i-stop"/></svg>停止任务</button>
        <button class="btn ghost sm" onclick="loadLogs()"><svg class="ic"><use href="#i-refresh"/></svg>刷新日志</button>
      </div>
    </div>
    <div class="card stat-grid">
      <div class="stat blue"><div class="k">当前任务</div><div class="v" id="sTask" style="font-size:16px">—</div></div>
      <div class="stat ok"><div class="k">运行状态</div><div class="v" id="sRun" style="font-size:16px">空闲</div></div>
      <div class="stat"><div class="k">已观看 / 总时长</div><div class="v" id="sTime">0<small>分钟</small></div></div>
      <div class="stat warn"><div class="k">进程 PID</div><div class="v" id="sPid">—</div></div>

  <div class="modal">

<div class="toasts" id="toasts"></div>

<script>
let S={running:false,external:false,pct:0}, filter='all', autoScroll=true, lastLog='', busy=false;
const $=id=>document.getElementById(id);

function toast(msg,type='ok'){
  const el=document.createElement('div');
  el.className='toast '+type;
  const ic=document.createElementNS('http://www.w3.org/2000/svg','svg');
  ic.setAttribute('class','ic');
  const u=document.createElementNS('http://www.w3.org/2000/svg','use');
  u.setAttribute('href',type==='bad'?'#i-alert':'#i-check');
  ic.appendChild(u); el.appendChild(ic);
  const s=document.createElement('span'); s.textContent=msg; el.appendChild(s);
  $('toasts').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transform='translateY(8px)';el.style.transition='.25s';setTimeout(()=>el.remove(),260)},3600);
}
async function api(path,opt){
  try{const r=await fetch(path,opt);return await r.json()}catch(e){return {__err:String(e)}}
}
function post(path,data){return api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data||{})})}

function setBusyUI(){
  const blocked=S.running;
  document.querySelectorAll('[data-run]').forEach(b=>{b.disabled=blocked});
  $('btnMain').disabled=blocked;
  $('btnStop').disabled=!S.running;
  $('inputRow').classList.toggle('show',S.running);
  const pill=$('statusPill'),txt=$('statusText');
  pill.className='pill';
  if(S.running){pill.classList.add('on');txt.textContent='任务运行中';}
  else if(S.external){pill.classList.add('busy');txt.textContent='外部实例运行中';}
  else{txt.textContent='空闲 · 就绪';}
  $('notice').classList.toggle('show',S.external&&!S.running);
  if(S.external&&!S.running)$('noticeText').textContent='检测到另一个刷课实例正在写入日志。为避免平台「多终端登录」互相顶号，从这里启动任务时会先二次确认；本页当前为只读监控。';
}
async function poll(){
  const s=await api('/api/status');
  if(s.__err){
    $('statusText').textContent='服务未连接';$('statusPill').className='pill off';
    $('heroTitle').textContent='本地服务未启动';
    $('heroDesc').textContent='请双击桌面 55.bat 启动控制台服务，然后刷新本页。';
    $('notice').classList.add('show');
    $('noticeText').textContent='当前为静态预览模式，按钮不可用。双击桌面 55.bat 后即可完整控制。';
    document.querySelectorAll('[data-run]').forEach(b=>b.disabled=true);
    $('btnMain').disabled=true;return;
  }
  S.running=!!s.running;S.external=!!s.external;
  $('ver').textContent='v'+(s.version||'1.1.3');
  $('addr').textContent='127.0.0.1:'+(s.port||'');
  $('sTask').textContent=s.running?s.label:'—';
  $('sRun').textContent=s.running?'运行中':(s.external?'外部运行中':'空闲');
  $('sPid').textContent=s.running?(s.pid||'—'):'—';
  $('sLog').textContent=s.log_file||'—';
  $('logName').textContent=s.log_file||'run_*.log';
  const p=s.progress||{cur:0,total:0,pct:0};
  S.pct=p.pct||0;
  $('barFill').style.width=S.pct+'%';
  $('barPct').textContent=S.pct+'%';
  $('barLabel').textContent=p.total?`进度 ${p.cur}s / ${p.total}s`:'当前进度';
  $('sTime').innerHTML=(p.total?(p.cur/60).toFixed(0):'0')+'<small>/ '+(p.total?(p.total/60).toFixed(0):'0')+' 分钟</small>';
  if(S.running){$('heroTitle').textContent=s.label+' 进行中';$('heroDesc').textContent='任务由本控制台启动，日志实时更新中。运行期间请不要关闭或最小化浏览器窗口。';}
  else if(S.external){$('heroTitle').textContent='已有实例正在刷课';$('heroDesc').textContent='控制台正在只读监控外部实例的日志与进度，不会干扰它。';}
  else{$('heroTitle').textContent='等待开始';$('heroDesc').textContent='选择下方任务即可开始自动学习，运行期间请保持浏览器窗口可见。';}
  setBusyUI();
}
async function loadLogs(){
  const d=await api('/api/logs?n=260');
  if(d.__err||!d.lines)return;
  const body=$('logBody');const atBottom=body.scrollHeight-body.scrollTop-body.clientHeight<60;
  const frag=document.createDocumentFragment();
  d.lines.forEach((raw,i)=>{
    const line=raw.replace(/\s+$/,'');
    let cls='';
    if(/\[ERROR\]|\[CRITICAL\]|错误|失败|异常/.test(line))cls='err';
    else if(/\[WARN\]|警告|提示/.test(line))cls='warn';
    else if(/进度\s+\d+\/\d+s|完成线|倍速/.test(line))cls='prog';
    else if(/已完成|成功|通过|✔|完成报告/.test(line))cls='good';
    else if(/\[INFO\]/.test(line))cls='info';
    else if(/^[-=]{6}|^\s*$/.test(line))cls='dim';
    if(filter==='warn'&&cls!=='warn'&&cls!=='err')return;
    if(filter==='info'&&(cls==='warn'||cls==='err'))return;
    const row=document.createElement('div');row.className='ln '+cls;
    const n=document.createElement('span');n.className='n';n.textContent=String(i+1);
    const c=document.createElement('span');c.className='c';c.textContent=line||' ';
    row.appendChild(n);row.appendChild(c);frag.appendChild(row);
  });
  body.replaceChildren(frag);
  if(autoScroll||atBottom)body.scrollTop=body.scrollHeight;
  $('logHint').textContent=(d.lines.length||0)+' 行 · 每 1.5 秒刷新';
}
function setFilter(f,btn){filter=f;document.querySelectorAll('.chip[data-f]').forEach(b=>b.classList.toggle('on',b===btn));loadLogs()}
function toggleAuto(){autoScroll=!autoScroll;$('autoBtn').classList.toggle('on',autoScroll);$('autoBtn').textContent=autoScroll?'自动滚动':'滚动已暂停'}

async function run(cmd,force){
  if((S.running||S.external)&&!force){
    if(S.running){toast('已有任务在运行','bad');return}
    confirmBox('检测到外部实例','继续启动可能触发平台「多终端登录」提示、两个实例互相顶号。确定仍要启动吗？',()=>run(cmd,true));return;
  }
  const r=await post('/api/run',{cmd,force:!!force});
  toast(r.message||(r.ok?'已启动':'启动失败'),r.ok?'ok':'bad');
  if(r.ok)setTimeout(()=>{poll();loadLogs()},600);
}
async function stopJob(){
  confirmBox('停止任务','会向当前任务发送终止指令，浏览器窗口可能需要手动关闭。确定停止吗？',async()=>{
    const r=await post('/api/stop');toast(r.message,r.ok?'ok':'bad');setTimeout(poll,500);
  });
}
async function sendInput(){
  const el=$('stdin'),v=el.value.trim();if(!v)return;
  const r=await post('/api/input',{text:v});
  if(r.ok){el.value='';toast('已发送：'+v)}else toast(r.message||'发送失败','bad');
}
async function openDir(t){const r=await post('/api/open',{target:t});toast(r.message,r.ok?'ok':'bad')}

let pickerState={items:[],selected:[],lessonMode:'all',lessonInput:''};
function moveSel(name,delta,stale,source){
  const i=pickerState.selected.indexOf(name),j=i+delta;
  if(i<0||j<0||j>=pickerState.selected.length)return;
  const t=pickerState.selected[j];pickerState.selected[j]=pickerState.selected[i];pickerState.selected[i]=t;
  renderPicker(stale,source);
}
function isActionable(c){return !/已完成|已结束|已退课|无任务|未开课/.test(c.status||'')}
async function openPicker(){
  const d=await api('/api/courses');
  pickerState.items=d.items||[];
  pickerState.selected=[];
  renderPicker(!!d.stale,d.source||'');
}
function renderPicker(stale,source){
  const box=document.createElement('div');
  const tip=document.createElement('div');
  tip.style.cssText='font-size:12.5px;color:#8a9ab8;line-height:1.7;margin-bottom:13px';
  if(pickerState.items.length){
    const from=source==='log'?'（这是历史日志快照，新加的课程可能不在这里；正在自动从平台拉取，请稍后重开本窗口，或点「从平台拉取」）':(stale?'（清单可能过期，正在自动拉取最新课程）':'');
    tip.textContent=`共 ${pickerState.items.length} 门课程${from}。默认不勾选，请手动选择；左侧序号就是刷课执行顺序，可用 ↑↓ 调整。`;
  }else{
    tip.textContent='还没有课程清单。点下方「从平台拉取」会打开浏览器读取你账号下的课程（需要登录/扫码）。';
  }
  box.appendChild(tip);

  if(pickerState.items.length){
    const tools=document.createElement('div');
    tools.style.cssText='display:flex;gap:8px;margin-bottom:11px;flex-wrap:wrap;align-items:center';
    tools.appendChild(btn('全选',()=>{pickerState.selected=pickerState.items.map(c=>c.name);renderPicker(stale,source)},'ghost sm'));
    tools.appendChild(btn('只选可处理',()=>{pickerState.selected=pickerState.items.filter(isActionable).map(c=>c.name);renderPicker(stale,source)},'ghost sm'));
    tools.appendChild(btn('清空',()=>{pickerState.selected=[];renderPicker(stale,source)},'ghost sm'));
    const cnt=document.createElement('span');
    cnt.style.cssText='font-size:11.5px;color:#5d6b88;margin-left:auto';
    cnt.textContent='已选 '+pickerState.selected.length+' 门（按序号执行）';
    tools.appendChild(cnt);
    box.appendChild(tools);

    const list=document.createElement('div');
    list.style.cssText='max-height:300px;overflow:auto;border:1px solid rgba(255,255,255,.09);border-radius:11px;padding:7px';
    pickerState.items.forEach(c=>{
      const row=document.createElement('label');
      row.className='rep-item';row.style.marginBottom='6px';
      const oi=pickerState.selected.indexOf(c.name);
      const cb=document.createElement('input');
      cb.type='checkbox';cb.checked=oi>=0;
      cb.style.cssText='width:16px;height:16px;accent-color:#6d8bff;cursor:pointer;flex:none';
      cb.onchange=()=>{
        const i=pickerState.selected.indexOf(c.name);
        if(cb.checked&&i<0)pickerState.selected.push(c.name);
        else if(!cb.checked&&i>=0)pickerState.selected.splice(i,1);
        renderPicker(stale,source);
      };
      const ord=document.createElement('span');
      ord.textContent=oi>=0?String(oi+1).padStart(2,'0'):'--';
      ord.title='刷课执行顺序';
      ord.style.cssText='font:11px var(--mono);color:#6d8bff;min-width:22px;text-align:center;flex:none';
      const nm=document.createElement('span');nm.className='nm';
      nm.style.cssText='flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
      nm.textContent=(c.label?'['+c.label+'] ':'')+c.name;
      const st=document.createElement('span');st.className='mt';
      st.textContent=(c.status||'')+(c.course_id?'  #'+c.course_id:'');
      st.style.color=/已完成/.test(c.status)?'#6d7d9b':(/可处理|进行中|待完成/.test(c.status)?'#35d6a4':'#ffc857');
      row.appendChild(cb);row.appendChild(ord);row.appendChild(nm);row.appendChild(st);
      if(oi>=0){
        const up=btn('↑',e=>{e.preventDefault();e.stopPropagation();moveSel(c.name,-1,stale,source)},'ghost sm');
        const dn=btn('↓',e=>{e.preventDefault();e.stopPropagation();moveSel(c.name,1,stale,source)},'ghost sm');
        for(const mb of [up,dn])mb.style.cssText='padding:2px 7px;font-size:12px;line-height:1.2;min-width:26px;flex:none';
        up.disabled=oi===0;dn.disabled=oi===pickerState.selected.length-1;
        row.appendChild(up);row.appendChild(dn);
      }
      list.appendChild(row);
    });
    box.appendChild(list);

    const lr=document.createElement('div');
    lr.style.cssText='margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap';
    const lab=document.createElement('span');lab.textContent='课时范围';
    lab.style.cssText='font-size:12.5px;color:#8a9ab8';
    const sel=document.createElement('select');
    sel.style.cssText='background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.16);color:#e9eefb;border-radius:8px;padding:8px 10px;font-size:12.5px';
    sel.innerHTML='<option value="all">全部课时</option><option value="some">只学指定</option>';
    sel.value=pickerState.lessonMode;
    const inp=document.createElement('input');
    inp.placeholder='如 1-5,8';
    inp.value=pickerState.lessonInput;
    inp.style.cssText='width:160px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:8px 10px;color:#e9eefb;font:12.5px var(--mono)';
    inp.style.display=pickerState.lessonMode==='some'?'':'none';
    sel.onchange=()=>{pickerState.lessonMode=sel.value;inp.style.display=sel.value==='some'?'':'none'};
    inp.oninput=()=>{pickerState.lessonInput=inp.value};
    lr.appendChild(lab);lr.appendChild(sel);lr.appendChild(inp);
    box.appendChild(lr);
  }

  const f=document.createDocumentFragment();
  f.appendChild(btn('关闭',closeModal,'ghost'));
  f.appendChild(btn('从平台拉取',()=>fetchCourses(false),''));
  f.appendChild(btn('开始学习',()=>startPicked(false),'primary'));
  modal('选择课程',box,f);
}
async function fetchCourses(force){
  toast('正在打开浏览器读取课程清单，请稍候…');
  const r=await post('/api/courses/fetch',{force:!!force});
  if(r.ok){
    pickerState.items=r.items||[];
    pickerState.selected=[];
    toast(r.message||'已获取课程');
    renderPicker(false,'cache');
    return;
  }
  if(!force&&/顶号|外部|运行/.test(r.message||'')){
    confirmBox('刷课正在运行',r.message+' 仍要强制拉取吗？',()=>fetchCourses(true));
    return;
  }
  toast(r.message||'拉取失败','bad');
}
async function startPicked(force){
  const names=pickerState.selected.slice();
  if(!names.length){toast('请先勾选课程','bad');return}
  const lessons=pickerState.lessonMode==='some'?pickerState.lessonInput.trim():'';
  const r=await post('/api/run',{cmd:'run',select:names.join(','),lessons,force:!!force});
  if(r.ok){
    toast(r.message||'已启动');
    closeModal();
    setTimeout(()=>{poll();loadLogs()},700);
    return;
  }
  if(!force&&/顶号|外部|运行/.test(r.message||'')){
    confirmBox('刷课正在运行',r.message+' 仍要强制启动吗？',()=>startPicked(true));
    return;
  }
  toast(r.message||'启动失败','bad');
}

async function openKey(){const r=await post('/api/open',{target:'key'});toast(r.message,r.ok?'ok':'bad')}
async function openTiku(){const r=await post('/api/open',{target:'tiku'});toast(r.message,r.ok?'ok':'bad')}

function modal(title,bodyNode,footNode){
  $('mTitle').textContent=title;$('mBody').replaceChildren(bodyNode);$('mFoot').replaceChildren(footNode||document.createDocumentFragment());
  $('mask').classList.add('show');
}
function closeModal(){$('mask').classList.remove('show')}
function btn(text,fn,cls){const b=document.createElement('button');b.className='btn '+(cls||'');b.textContent=text;b.onclick=fn;return b}
function confirmBox(title,text,onYes){
  const box=document.createElement('div');box.textContent=text;box.style.color='#c9d6ef';
  const f=document.createDocumentFragment();
  f.appendChild(btn('取消',closeModal,'ghost'));
  f.appendChild(btn('确定',()=>{closeModal();onYes()},'danger'));
  modal(title,box,f);
}
async function doctor(){
  toast('环境自检运行中，请稍候…');
  const r=await api('/api/doctor',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
  const pre=document.createElement('pre');pre.textContent=r.text||r.__err||'无输出';
  modal('环境自检结果',pre,btn('关闭',closeModal,'ghost'));
}
async function editConfig(){
  const r=await api('/api/config');
  const ta=document.createElement('textarea');ta.value=r.text||'';ta.spellcheck=false;
  const f=document.createDocumentFragment();
  f.appendChild(btn('取消',closeModal,'ghost'));
  f.appendChild(btn('保存配置',async()=>{
    const s=await post('/api/config',{text:ta.value});
    toast(s.message||(s.ok?'已保存':'保存失败'),s.ok?'ok':'bad');if(s.ok)closeModal();
  },'primary'));
  modal('编辑 config.yaml',ta,f);
}
async function reports(){
  const r=await api('/api/reports');
  const box=document.createElement('div');
  if(!r.items||!r.items.length){box.textContent='暂时还没有完成报告。';}
  else r.items.forEach(it=>{
    const d=document.createElement('div');d.className='rep-item';
    const nm=document.createElement('span');nm.className='nm';nm.textContent=it.name;
    const mt=document.createElement('span');mt.className='mt';mt.textContent=new Date(it.mtime*1000).toLocaleString('zh-CN');
    d.appendChild(nm);d.appendChild(mt);
    d.onclick=async()=>{const s=await post('/api/open',{target:'report:'+it.name});toast(s.message,s.ok?'ok':'bad')};
    box.appendChild(d);
  });
  modal('完成报告',box,btn('关闭',closeModal,'ghost'));
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
poll();loadLogs();setInterval(()=>{poll();loadLogs()},1500);
</script>
</body>
